<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ForensicRecover — Case Management. Create, view, and manage investigation cases.">
  <title>Cases — ForensicRecover</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <div class="page-header">
        <div class="page-title">
          <h1>Case Management</h1>
          <p>Create and manage investigation cases</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="UI.openModal('create-case-modal')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Case
          </button>
        </div>
      </div>

      <div class="page-body">
        <div class="card card-elevated">
          <div class="card-header">
            <h3>All Cases</h3>
            <div class="flex gap-3">
              <select id="filter-status" onchange="loadCases()" class="form-group" style="margin:0; padding:6px 10px; border:1.5px solid var(--border-color); border-radius:var(--radius-md); font-size:var(--font-size-sm); font-family:var(--font-family);">
                <option value="">All Status</option>
                <option value="ACTIVE">Active</option>
                <option value="PENDING">Pending</option>
                <option value="CLOSED">Closed</option>
              </select>
            </div>
          </div>
          <div class="card-body" style="padding:0">
            <div class="data-table-wrapper">
              <table class="data-table" id="cases-table">
                <thead>
                  <tr>
                    <th>Case Number</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="cases-body">
                  <tr><td colspan="6" class="text-center text-muted" style="padding:3rem">Loading cases...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Case Modal -->
  <div class="modal-overlay" id="create-case-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Create New Case</h2>
        <button class="modal-close" onclick="UI.closeModal('create-case-modal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="create-case-form" onsubmit="handleCreateCase(event)">
          <div class="form-group">
            <label for="case-type">Case Type</label>
            <select id="case-type" required>
              <option value="">Select type...</option>
              <option value="Cyber Investigation">Cyber Investigation</option>
              <option value="Fraud Investigation">Fraud Investigation</option>
              <option value="Criminal Investigation">Criminal Investigation</option>
              <option value="Corporate Investigation">Corporate Investigation</option>
              <option value="Incident Response">Incident Response</option>
              <option value="Data Breach">Data Breach</option>
              <option value="Intellectual Property">Intellectual Property</option>
              <option value="Employee Misconduct">Employee Misconduct</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="case-desc">Description</label>
            <textarea id="case-desc" placeholder="Brief description of the investigation..." rows="3"></textarea>
          </div>
          <div class="modal-footer" style="margin: 0 calc(var(--space-6) * -1) calc(var(--space-6) * -1); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border-color); background: var(--slate-50); border-radius: 0 0 var(--radius-xl) var(--radius-xl);">
            <button type="button" class="btn btn-secondary" onclick="UI.closeModal('create-case-modal')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-create-case">Create Case</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('Not authenticated');
    document.getElementById('sidebar-container').innerHTML = renderSidebar('cases');

    async function loadCases() {
      try {
        const status = document.getElementById('filter-status').value;
        const url = status ? `/api/cases?status=${status}` : '/api/cases';
        const cases = await API.get(url);
        const tbody = document.getElementById('cases-body');

        if (!cases.length) {
          tbody.innerHTML = UI.emptyState('No cases found', 'Create a new case to get started');
          return;
        }

        tbody.innerHTML = cases.map(c => `
          <tr>
            <td><strong>${c.case_number}</strong></td>
            <td>${c.case_type}</td>
            <td class="truncate" style="max-width:200px">${c.description || '—'}</td>
            <td>${UI.badge(c.status)}</td>
            <td class="text-sm text-muted">${UI.formatDate(c.created_at)}</td>
            <td>
              <div class="flex gap-2">
                ${c.status === 'ACTIVE' ? `<button class="btn btn-sm btn-secondary" onclick="closeCase(${c.id})">Close</button>` : ''}
                <a href="/evidence?case_id=${c.id}" class="btn btn-sm btn-secondary">Evidence</a>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        Toast.error('Failed to load cases: ' + err.message);
      }
    }

    async function handleCreateCase(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-create-case');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const data = {
          case_type: document.getElementById('case-type').value,
          description: document.getElementById('case-desc').value,
        };
        await API.post('/api/cases', data);
        UI.closeModal('create-case-modal');
        document.getElementById('create-case-form').reset();
        Toast.success('Case created successfully');
        loadCases();
      } catch (err) {
        Toast.error(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Case';
      }
    }

    async function closeCase(id) {
      if (!confirm('Close this case?')) return;
      try {
        await API.patch(`/api/cases/${id}/close`);
        Toast.success('Case closed');
        loadCases();
      } catch (err) {
        Toast.error(err.message);
      }
    }

    loadCases();
  </script>
</body>
</html>
